name: Packaging (Nix)

on:
  workflow_call:
    inputs:
      docker_image:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: ${{ inputs.docker_image }}
  CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'villas' }}

permissions:
  contents: read
  packages: write

jobs:
  pkg-nix-arx:
    name: "pkg:nix:arx [${{ matrix.system }}]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: villas

      - name: Bundle as arx
        run: |
          nix bundle --print-build-logs --out-link bundle-arx \
            --bundler github:nix-community/nix-bundle \
            ".#villas-node-${{ matrix.system }}"
          mkdir -p artifacts
          cp -L bundle-arx artifacts/villas-${{ matrix.system }}

      - uses: actions/upload-artifact@v7
        with:
          name: villas-arx-${{ matrix.system }}
          path: artifacts/
          retention-days: 90

  pkg-nix-rpm:
    name: "pkg:nix:rpm [${{ matrix.system }}]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: villas

      - name: Bundle as RPM
        run: |
          nix bundle --print-build-logs --out-link bundle-rpm \
            --bundler github:NixOS/bundlers#toRPM \
            ".#villas-node-${{ matrix.system }}"
          mkdir -p artifacts
          cp -L bundle-rpm/*.rpm artifacts/villas-${{ matrix.system }}.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: villas-rpm-${{ matrix.system }}
          path: artifacts/
          retention-days: 90

  pkg-nix-docker:
    name: "pkg:nix:docker [${{ matrix.system }}]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: villas

      - name: Bundle as Docker image
        run: |
          mkdir -p /var/tmp/
          nix bundle --print-build-logs --out-link bundle-docker \
            --bundler github:NixOS/bundlers#toDockerImage \
            ".#villas-node-${{ matrix.system }}"

      - name: Compute safe ref tag
        id: ref
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Push to registry
        env:
          CONTAINERS_REGISTRIES_CONF: ${{ runner.temp }}/registries.conf
        run: |
          echo 'unqualified-search-registries = []' > "$CONTAINERS_REGISTRIES_CONF"
          nix run nixpkgs#skopeo -- login \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            "${{ env.REGISTRY }}"
          nix run nixpkgs#skopeo -- \
            --tmpdir="${{ runner.temp }}" \
            --insecure-policy \
            copy "docker-archive:./bundle-docker" \
            "docker://${{ env.DOCKER_IMAGE }}:${{ steps.ref.outputs.tag }}-nix-${{ matrix.system }}"
