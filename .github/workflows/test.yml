name: Test

on:
  workflow_call:
    inputs:
      docker_image:
        required: true
        type: string

env:
  CMAKE_BUILD_OPTS: --parallel 16
  CMAKE_OPTS: -DCMAKE_INSTALL_PREFIX=${PREFIX}

permissions:
  contents: read
  packages: read

jobs:
  test-python:
    name: test:python
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.docker_image }}/dev-fedora:${{ github.sha }}
      options: --user root
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run Python tests
        run: |
          cd python
          pytest --verbose .

      - name: Check formatting
        run: |
          cd python
          black --line-length=90 --extend-exclude=".*(\.pyi|_pb2.py)$" --check .

      - name: Lint with flake8
        run: |
          cd python
          flake8 --max-line-length=90 --extend-exclude="*.pyi,*_pb2.py" .

      - name: Type check with mypy
        run: |
          cd python
          mypy --namespace-packages --explicit-package-bases .

  test-cppcheck:
    name: test:cppcheck
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.docker_image }}/dev-fedora:${{ github.sha }}
      options: --user root
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run cppcheck
        run: ./tools/run-cppcheck.sh | tee cppcheck.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cppcheck-log
          path: cppcheck.log

  test-unit:
    name: test:unit
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.docker_image }}/dev-fedora:${{ github.sha }}
      options: --user root
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build

      - name: Build and run unit tests
        run: LD_LIBRARY_PATH=/usr/local/lib64:$LD_LIBRARY_PATH cmake --build build ${{ env.CMAKE_BUILD_OPTS }} --target run-unit-tests run-unit-tests-common

  test-integration:
    name: test:integration
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.docker_image }}/dev-fedora:${{ github.sha }}
      options: --user root
    services:
      rabbitmq:
        image: rwthacs/rabbitmq
      redis:
        image: redis:6.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Start mosquitto
        run: |
          echo "127.0.0.1 mosquitto" >> /etc/hosts
          cat > /tmp/mosquitto.conf <<'EOF'
          listener 1883
          allow_anonymous true
          EOF
          mosquitto -c /tmp/mosquitto.conf -d

      - name: Configure
        run: |
            cmake -S . -B build
            cmake --build build --target install

      - name: Build and run integration tests
        run: cmake --build build --target run-integration-tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-tests
          path: build/tests/integration/
